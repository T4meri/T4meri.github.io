<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Spark</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23c23b3b' d='M12 1l2.2 8.8L23 12l-8.8 2.2L12 23l-2.2-8.8L1 12l8.8-2.2z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="styles.css?v=5ae04e4">
  <link rel="stylesheet" href="theme.css?v=5ae04e4">
  <link rel="stylesheet" href="auth.css?v=5ae04e4">
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="auth-head">
      <div class="auth-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 1l2.2 8.8L23 12l-8.8 2.2L12 23l-2.2-8.8L1 12l8.8-2.2z"/>
        </svg>
      </div>
      <h1 id="auth-heading">Welcome back</h1>
      <p id="auth-sub">Sign in to keep talking to Spark.</p>
    </div>

    <div class="auth-panel">
      <div id="credentials-view">
        <div class="tabs" role="tablist">
          <button class="tab" id="tab-login" role="tab" aria-selected="true" aria-controls="auth-form" type="button">Sign in</button>
          <button class="tab" id="tab-register" role="tab" aria-selected="false" aria-controls="auth-form" type="button">Create account</button>
        </div>

        <p class="notice" id="notice" hidden></p>

        <form id="auth-form" novalidate>
          <div class="field" id="name-field" hidden>
            <label for="displayName">Display name</label>
            <input type="text" id="displayName" name="displayName" autocomplete="nickname" placeholder="Optional">
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@domain.com">
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
            <p class="hint" id="password-hint" hidden>At least 8 characters.</p>
          </div>

          <div class="turnstile-slot" id="turnstile-slot"></div>

          <button class="submit" type="submit" id="submit">Sign in</button>
        </form>
      </div>

      <div id="verify-view" hidden>
        <p class="notice" id="verify-notice" hidden></p>

        <p class="verify-lead">
          We sent a 6-digit code to <strong id="verify-email">your inbox</strong>.
        </p>

        <form id="verify-form" novalidate>
          <div class="field">
            <label for="code">Verification code</label>
            <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
                   maxlength="7" placeholder="000000" class="code-input" required>
          </div>

          <button class="submit" type="submit" id="verify-submit">Verify email</button>
        </form>

        <p class="verify-actions">
          Didn't get it?
          <button type="button" class="link-btn" id="resend">Send another code</button>
        </p>
      </div>
    </div>

    <p class="auth-foot"><a href="index.html">Back to Spark</a></p>
  </main>

  <script src="config.js?v=5ae04e4"></script>
  <script src="api.js?v=5ae04e4"></script>
  <script src="auth.js?v=5ae04e4"></script>
</body>
</html>
